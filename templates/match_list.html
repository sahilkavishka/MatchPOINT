
{% block content %}
<div class="container">
    <h2>Match List</h2>
    <a href="{% url 'create_match' %}">Add Match</a>
    <ul>
        {% for match in matches %}
            <li>{{ match.team_a.name }} ({{ match.team_a_score }}) vs {{ match.team_b.name }} ({{ match.team_b_score }}) on {{ match.date }}</li>
        {% empty %}
            <li>No matches scheduled.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
