

{% block extra_css %}
{% load static %}
<link rel="stylesheet" href="{% static 'reset_password.css' %}">
{% endblock %}

{% block content %}
<div class="password-reset-container">
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} password-alert">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}

 
        <form method="POST" class="password-reset-form">
            {% csrf_token %}
            
            <div class="password-input-group">
                <input type="password" name="new_password" id="new_password" 
                       class="password-input" placeholder="New Password" required>
                <span class="password-toggle" onclick="togglePassword('new_password')">
                    <i class="fas fa-eye"></i>
                </span>
                <div class="password-strength">
                    <div class="password-strength-bar" id="password-strength-bar"></div>
                </div>
            </div>
            
            <div class="password-input-group">
                <input type="password" name="confirm_password" id="confirm_password" 
                       class="password-input" placeholder="Confirm Password" required>
                <span class="password-toggle" onclick="togglePassword('confirm_password')">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
            
            <center><button type="submit" class="password-reset-btn">Update Password</button></center>
        </form>
    </div>


<script>
    // Toggle password visibility
    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = input.nextElementSibling.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Password strength indicator
    document.getElementById('new_password').addEventListener('input', function(e) {
        const strengthBar = document.getElementById('password-strength-bar');
        const strength = calculatePasswordStrength(e.target.value);
        
        strengthBar.style.width = strength.percentage + '%';
        strengthBar.style.backgroundColor = strength.color;
    });

    function calculatePasswordStrength(password) {
        let strength = 0;
        // Length check
        if (password.length > 0) strength += 10;
        if (password.length >= 8) strength += 20;
        // Complexity checks
        if (/[A-Z]/.test(password)) strength += 20;
        if (/[0-9]/.test(password)) strength += 20;
        if (/[^A-Za-z0-9]/.test(password)) strength += 30;
        
        // Cap at 100
        strength = Math.min(strength, 100);
        
        return {
            percentage: strength,
            color: strength < 40 ? '#dc3545' : 
                   strength < 70 ? '#fd7e14' : '#28a745'
        };
    }
</script>
{% endblock %}
