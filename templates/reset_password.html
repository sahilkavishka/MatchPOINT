

{% block extra_css %}
<style>
    /* Password Reset Container */
    .password-reset-container {
        max-width: 500px;
        margin: 3rem auto;
        padding: 0 1rem;
        animation: fadeIn 0.4s ease-out;
    }
  body{
    
        background-color: #202020;
  }
    /* Form Styling */
    .password-reset-form {
        background-color: #171717;
        padding: 2.5rem;
        border-radius: 22px;
        box-shadow: 0 6px 20px rgba(23, 148, 23, 0.74);
    }

    /* Input Fields */
    .password-input-group {
        margin-bottom: 1.75rem;
        position: relative;
    }

    .password-input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e9ecef;
        border-radius: 18px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background-color: #f8f9fa;
    }

    .password-input:focus {
        border-color:rgb(78, 223, 78);
        box-shadow: 0 0 0 3px rgba(22, 97, 50, 0.73);
        background-color: #fff;
        outline: none;
    }

    .password-input::placeholder {
        color:rgba(35, 138, 52, 0.49);
    }

    /* Password Strength Indicator */
    .password-strength {
        height: 4px;
        background: #e9ecef;
        border-radius: 2px;
        margin-top: 0.5rem;
        overflow: hidden;
    }

    .password-strength-bar {
        height: 100%;
        width: 0;
        background: #dc3545;
        transition: width 0.3s ease, background 0.3s ease;
    }

    /* Button Styling */
    .password-reset-btn {
        width: 250px;
        padding: 14px;
        background: linear-gradient(135deg,rgb(30, 124, 18) 0%,rgb(34, 190, 94) 100%);
        color: white;
        border: none;
        border-radius: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .password-reset-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(78, 223, 102, 0.3);
    }

    .password-reset-btn:active {
        transform: translateY(0);
    }

    /* Alert Messages */
    .password-alert {
        padding: 1rem 1.25rem;
        margin-bottom: 1.75rem;
        border-radius: 8px;
        border-left: 4px solid;
    }

    .alert-success {
        background-color: #f6ffed;
        border-color: #52c41a;
        color: #52c41a;
    }

    .alert-error {
        background-color: #fff2f0;
        border-color: #ff4d4f;
        color: #ff4d4f;
    }

    /* Show/Hide Password Toggle */
    .password-toggle {
        position: absolute;
        right: 12px;
        top: 42px;
        cursor: pointer;
        color: #adb5bd;
        transition: color 0.2s;
    }

    .password-toggle:hover {
        color: #6c757d;
    }

    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive Design */
    @media (max-width: 576px) {
        .password-reset-container {
            margin: 1.5rem auto;
        }
        
        .password-reset-form {
            padding: 1.75rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="password-reset-container">
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} password-alert">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}

 
        <form method="POST" class="password-reset-form">
            {% csrf_token %}
            
            <div class="password-input-group">
                <input type="password" name="new_password" id="new_password" 
                       class="password-input" placeholder="New Password" required>
                <span class="password-toggle" onclick="togglePassword('new_password')">
                    <i class="fas fa-eye"></i>
                </span>
                <div class="password-strength">
                    <div class="password-strength-bar" id="password-strength-bar"></div>
                </div>
            </div>
            
            <div class="password-input-group">
                <input type="password" name="confirm_password" id="confirm_password" 
                       class="password-input" placeholder="Confirm Password" required>
                <span class="password-toggle" onclick="togglePassword('confirm_password')">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
            
            <center><button type="submit" class="password-reset-btn">Update Password</button></center>
        </form>
    </div>


<script>
    // Toggle password visibility
    function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = input.nextElementSibling.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Password strength indicator
    document.getElementById('new_password').addEventListener('input', function(e) {
        const strengthBar = document.getElementById('password-strength-bar');
        const strength = calculatePasswordStrength(e.target.value);
        
        strengthBar.style.width = strength.percentage + '%';
        strengthBar.style.backgroundColor = strength.color;
    });

    function calculatePasswordStrength(password) {
        let strength = 0;
        // Length check
        if (password.length > 0) strength += 10;
        if (password.length >= 8) strength += 20;
        // Complexity checks
        if (/[A-Z]/.test(password)) strength += 20;
        if (/[0-9]/.test(password)) strength += 20;
        if (/[^A-Za-z0-9]/.test(password)) strength += 30;
        
        // Cap at 100
        strength = Math.min(strength, 100);
        
        return {
            percentage: strength,
            color: strength < 40 ? '#dc3545' : 
                   strength < 70 ? '#fd7e14' : '#28a745'
        };
    }
</script>
{% endblock %}
