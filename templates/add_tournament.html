<html>
<head>
    <title>Add Tournament</title>
    <style type="text/css">
        /* Reset default browser styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color:rgba(15, 104, 22, 0.56);
            color:rgb(8, 8, 8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        form {
            background-color: rgb(129, 209, 127);
            padding: 30px 40px;
            border-radius: 20px;
            border: solid 2px rgb(35, 128, 40);

            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        form:hover {
            transform: scale(1.01);
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
            color:rgb(15, 15, 15);
            letter-spacing: 1px;
        }

        p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color:rgb(15, 15, 15);
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select,
        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: solid 2px rgb(22, 180, 43);
            font-size: 15px;
            transition: background-color 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            background-color:rgba(40, 114, 47, 0.64);
            outline: none;
            color:black;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color:rgb(23, 151, 40);
            border: solid 2px rgb(246, 247, 246);
            border-radius: 18px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1e8449;
        }

        /* CSRF + Django form fields container fix */
        form > p {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <form method="POST" enctype="multipart/form-data">
        <h2>Add Tournament</h2>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ADD</button>
        <button type="reset">RESET</button>
        <button onclick="history.back()">BACK </button>
    </form>
</body>
</html>
