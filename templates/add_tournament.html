<html>
<head>
    <title>Add Tournament</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;600&display=swap');

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg,rgb(15, 15, 15), #14532d);
            color: #e8f5e9;
           
            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        form {
            margin-top:900px;
            
            background-color: #2e5230;
            border-radius: 20px;
            padding: 40px 35px 45px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 18px rgba(19, 190, 27, 0.86);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        form:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(11, 224, 46, 0.85);
        }

        h2 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 2.7rem;
            margin-bottom: 30px;
            text-align: center;
            color: #a5d6a7;
            text-shadow: 1.5px 1.5px 4pxrgb(22, 31, 21);
            user-select: none;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 1.05rem;
            color: #c8e6c9;
            user-select: none;
            transition: color 0.3s ease;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select,
        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 22px;
            border-radius: 15px;
            border: 2px solid #4caf50;
            background-color: #f1f8f1;
            color: #2e5230;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: inset 0 2px 6px rgba(46, 82, 48, 0.3);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #81c784;
            box-shadow: 0 0 8px 2px #81c784aa;
            background-color: #e8f5e9;
            color: #1b3a2a;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            max-width: 100%;
        }

        button {
            width: 100%;
            padding: 14px 0;
            margin-top: 10px;
            border-radius: 25px;
            border: none;
            background-color: #4caf50;
            color: #1b3a2a;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(7, 7, 7, 0.84);
            transition: background-color 0.3s ease, transform 0.2s ease;
            user-select: none;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }
        button:hover {
            background-color: #81c784;
            box-shadow: 0 10px 20px rgba(129, 199, 132, 0.85);
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }

        /* Space between multiple buttons */
        button + button {
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <form method="POST" enctype="multipart/form-data">
        <h2>Add Tournament</h2>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ADD</button>
        <button type="reset">RESET</button>
        <button type="button" onclick="history.back()">BACK</button>
    </form>
</body>
</html>
