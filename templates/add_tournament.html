<html>
<head>
    <title>Add Tournament</title>
    <style type="text/css">
        /* Reset default browser styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color:rgb(8, 8, 8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        form {
            background-color:rgb(39, 100, 52);
            padding: 30px 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        form:hover {
            transform: scale(1.01);
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
            color:rgb(15, 15, 15);
            letter-spacing: 1px;
        }

        p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color:rgb(15, 15, 15);
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select,
        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            background-color:rgb(41, 148, 49);
            color: #fff;
            font-size: 15px;
            transition: background-color 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            background-color:rgba(40, 114, 47, 0.64);
            outline: none;
            color:black;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color:rgb(16, 207, 41);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: #1e8449;
        }

        /* CSRF + Django form fields container fix */
        form > p {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <form method="POST" enctype="multipart/form-data">
        <h2>Add Tournament</h2>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add</button>
    </form>
</body>
</html>
