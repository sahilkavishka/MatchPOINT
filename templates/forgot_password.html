

{% block extra_css %}

{% endblock %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'forgot_password.css' %}">

<div class="forgot-password-container">
    <h2 class="forgot-password-header">Forgot Password</h2>
    
    
    <div class="forgot-password-card">
        <form method="post" class="forgot-password-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required 
                       placeholder="Enter your registered email">
            </div>
            <center><button type="submit" class="btn forgot-password-btn">Send OTP</button></center>
        </form>
    </div>
</div>
{% endblock %}
