

{% block extra_css %}
<style>
    /* Main Container */
    .forgot-password-container {
        max-width: 500px;
        margin: 4rem auto;
        animation: fadeIn 0.5s ease-out;
        
    }
    body{
        background-color: #202020;
    }

    /* Header Styling */
    .forgot-password-header {
        color:rgb(244, 247, 245);
        font-weight: 700;
        margin-bottom: 2rem;
        text-align: center;
        font-size: 2rem;
        position: relative;
        padding-bottom: 0.5rem;
        
    }



    /* Card Styling */
    .forgot-password-card {
        border: none;
        border-radius: 22px;
        box-shadow: 0 5px 25px rgba(32, 168, 27, 0.76);
        padding: 2.5rem;
        background-color: #171717;
        
    }

    /* Form Elements */
    .forgot-password-form .form-group {
        margin-bottom: 1.75rem;
    }

    .forgot-password-form label {
        font-weight: 600;
        color:rgb(246, 248, 246);
        margin-bottom: 0.75rem;
        display: block;
        font-size: 0.95rem;
    }

    .forgot-password-form input {
        border: 2px solidrgb(27, 141, 46);
        border-radius: 18px;
        padding: 12px 15px;
        font-size: 1rem;
        transition: all 0.3s;
        width:400px;
        height: calc(2.5em + 0.75rem + 2px);
    }

    .forgot-password-form input:focus {
        border-color:rgb(78, 223, 114);
        box-shadow: 0 0 0 0.2rem rgba(78, 223, 122, 0.65);
    }

    /* Button Styling */
    .forgot-password-btn {
        background: linear-gradient(135deg,rgb(78, 223, 102) 0%,rgb(34, 190, 42) 100%);
        border: none;
        border-radius: 18px;
        padding: 12px 24px;
        font-weight: 600;
        letter-spacing: 0.5px;
        width: 150px;
        transition: all 0.3s;
        text-transform: uppercase;

        cursor:pointer;
        margin-top: 0.5rem;
        box-shadow: 0 4px 12px rgba(8, 8, 8, 0.9);
    }

    .forgot-password-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(9, 9, 10, 0.78);
    }

    .forgot-password-btn:active {
        transform: translateY(3);
    }

    /* Alert Messages */
    .forgot-password-alert {
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.75rem;
        border-left: 4px solid;
    }

    .alert-error {
        border-left-color:rgb(15, 212, 8);
        color:white;
    }

    .alert-success {
        border-left-color: #1cc88a;
    }

    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive Adjustments */
    @media (max-width: 576px) {
        .forgot-password-container {
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .forgot-password-card {
            padding: 1.75rem;
        }
        
        .forgot-password-header {
            font-size: 1.75rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="forgot-password-container">
    <h2 class="forgot-password-header">Forgot Password</h2>
    
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} forgot-password-alert">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}
    
    <div class="forgot-password-card">
        <form method="post" class="forgot-password-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required 
                       placeholder="Enter your registered email">
            </div>
            <center><button type="submit" class="btn forgot-password-btn">Send OTP</button></center>
        </form>
    </div>
</div>
{% endblock %}
