{% extends 'base.html' %}
{% block content %}
{% load static %}

<style>
    .teams-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 20px;
        background-color:rgba(15, 104, 22, 0.56);
        
    }

    .team-card {
        background-color: rgb(129, 209, 127);
        border-radius: 10px;
        box-shadow: 2px 4px 3px rgba(0, 0, 0, 0.4);
        padding: 15px;
        text-align: center;
        width: 200px;
        transition: transform 0.3s, box-shadow 0.3s;
        margin-top:100px;
    }

    .team-card:hover {
        transform: translateY(-10px);
        box-shadow: 5px 10px 15px rgba(0, 0, 0, 0.7);
        background: rgb(21, 167, 45);
    }

    .teamlogo {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid white;
        box-shadow: 5px 0 5px rgba(0, 0, 0, 0.2);
    }

    .team-card a {
        display: block;
        text-decoration: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        margin-top: 10px;
        transition: color 0.3s;
    }
</style>

<div class="teams-container">
    
    {% for team in teams %}
    
        <div class="team-card">
   
            <a href="{% url 'team_detail' team.id %}">
                {% if team.logo %}
                    <img class="teamlogo" src="{{ team.logo.url }}" alt="{{ team.name }}">
                {% endif %}
                {{ team.name }}
            </a>
        </div>
    {% endfor %}
</div>

{% endblock %}
