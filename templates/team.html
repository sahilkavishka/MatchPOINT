{% extends 'base.html' %}
{% load static %}
{% block content %}

 <link rel="stylesheet" href="{% static 'team.css' %}">

<div class="teams-container">
    {% for team in teams %}
        <div class="team-card">
            <a href="{% url 'team_detail' team.id %}">
                {% if team.logo %}
                    <img class="teamlogo" src="{{ team.logo.url }}" alt="{{ team.name }}">
                {% endif %}
                {{ team.name }}
            </a>
        </div>
    {% endfor %}
</div>

{% endblock %}
