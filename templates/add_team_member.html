{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'add_team_member.css' %}">

<div class="addmem">
    {% if user.is_authenticated %}
        {% if user.role == "Player" %}
            <h2>Add Team Member</h2>  
            <form class="memform" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }} 
                <button class="btn1" type="submit">Add Member</button>
                <button class="btn1" type="reset">Reset</button>
                <button class="btn2" type="button" onclick="history.back()">Back</button>
            </form>
        {% else %}
            <p style="color: #f28b82;">Only players can add team members.</p>
        {% endif %}
    {% endif %}
</div>
{% endblock %}
