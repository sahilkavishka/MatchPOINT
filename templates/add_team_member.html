
{% block content %}
<style>
/* Container for form section */
.addmem {
   background-color: rgb(129, 209, 127);
    max-width: 600px;
    margin: 80px auto;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 12px 12px 20px rgba(0, 0, 0, 0.67);
    border:solid 1px rgba(10, 9, 9, 0.42);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body{
    background-color:rgba(15, 104, 22, 0.56);
}

/* Heading */
.addmem h2 {
    text-align: center;
    font-size: 28px;
    color:rgb(7, 7, 7);
    margin-bottom: 25px;
}

/* Paragraph message */
.addmem p {
    text-align: center;
    font-size: 16px;
    color:rgb(8, 8, 8);
    font-weight: bold;
    
}

/* Form styling */
.memform {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* Inputs & Textareas */
.memform input[type="text"],
.memform input[type="number"],
.memform input[type="file"],
.memform select,
.memform textarea {
    width: 400px;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid rgb(33, 102, 24);
    border-radius: 15px;
    background-color: #fafffc;
    transition: all 0.3s ease;
}

.memform input:focus,
.memform select:focus,
.memform textarea:focus {
    border-color:rgba(13, 14, 13, 0.73);
    box-shadow: 0 0 6px rgba(12, 12, 12, 0.61);
    outline: none;
}


.btn1,.btn2 {
    background-color:rgb(36, 177, 43);
    color: white;
    
    font-weight:bold;
    padding: 12px;
    border-radius: 15px;
    
    font-size: 16px;
    text-align: center;
    transition: background-color 0.3s ease;
    cursor: pointer;
}

.btn2:hover {
    background-color:rgb(10, 158, 64);
}
.btn1:hover {
    background-color:rgb(21, 175, 78);
}



/* Responsive tweaks */
@media (max-width: 640px) {
    .addmem {
        padding: 30px 20px;
        width: 90%;
    }

    .add, .back {
        width: 100%;
    }
}
</style>


<div class="addmem">
{% if user.is_authenticated %}
    {% if  user.role == "Player" %}
    
    <h2 >Add Team Member</h2>  
        <form class="memform" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }} 
        
            <button  class="btn1" type="submit" >Add Member</button>
            <button class="btn1" type="reset">Reset</button>
            <button class="btn2" onclick="history.back()">Back </button>
        
        </form>
    {% else %}
        <p style="color: red;">Only players can add team members.</p>
    {% endif %}
{% endif %}
    
{% endblock %}
</div>
