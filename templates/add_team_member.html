{% extends 'base.html' %}
{% block content %}
<style>
form {
    background: rgb(25, 168, 68)
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    max-width: 400px;
    margin: 20px auto;
}

h2 {
    text-align: center;
    color: #333;
}

p {
    text-align: center;
    font-size: 16px;
    color: green;
    font-weight: bold;
}


input, select, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}

/* Buttons */
.btn {
    display: block;
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    transition: background 0.3s ease;
    cursor: pointer;
}

.btn-primary {
    background-color:rgb(30, 236, 82);
    color: white;
    border: none;
}

.btn-primary:hover {
    background-color:rgb(16, 124, 34);
}

.btn-secondary {
    background-color: #6c757d;
    color: white;
    border: none;
    margin-top: 10px;
}

.btn-secondary:hover {
    background-color:rgb(34, 133, 72);
}
</style>

{% if user.is_authenticated %}
    {% if  user.role == "Player" %}
    <div class="addmem">
    <h2 >Add Team Member</h2>  
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}  
            <button type="submit" class="btn btn-primary">Add Member</button>
        </form>
    {% else %}
        <p style="color: red;">Only players can add team members.</p>
    {% endif %}
    <a href="{% url 'team_detail' team.id %}" class="btn btn-secondary">Back</a></div>
{% endif %}

{% endblock %}
