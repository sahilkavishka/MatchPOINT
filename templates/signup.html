<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: rgb(129, 209, 127);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 1000px;
            margin-top:10px;
            color:black;
        }

        form {
            
            background-color: rgba(10, 10, 10, 0.56);
            padding: 30px;
            border-radius: 20px;
            color: black;
            width: 400px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color:black;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid rgb(3, 3, 3);
            border-radius: 10px;
            background-color: #fff;
            font-size: 14px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background:  rgb(52, 219, 80);
            color: black;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(135deg, rgb(8, 92, 12), #1c658c);
        }

        .back-button {
            background-color: #444;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h2>Create Account</h2>

    <label for="id_username">Username</label>
    {{ form.username }}

    <label for="id_email">Email</label>
    {{ form.email }}

    <label for="id_password1">Password</label>
    {{ form.password1 }}

    <label for="id_password2">Confirm Password</label>
    {{ form.password2 }}

    <label for="id_role">Role</label>
    {{ form.role }}

    <label for="id_contact_number">Contact Number</label>
    {{ form.contact_number }}

    <label for="id_profile_picture">Profile Picture</label>
    {{ form.profile_picture }}

    <button type="submit">Register</button>
    <button type="reset" class="back-button">Reset</button>
    <button onclick="history.back()" class="back-button">Back</button>

    <p style="text-align:center; margin-top:10px;">
        Already have an account? <a href="{% url 'login' %}" style="color:lightblue;">Login here</a>
    </p>
</form>

</body>
</html>
