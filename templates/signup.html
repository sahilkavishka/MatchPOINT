<!DOCTYPE html>
<html >
<head>
    <style type="text/css">
        /* General page styling */
       /* General page styling */
/* General page styling */
body {
    font-family: 'Poppins', sans-serif;
    background-color:rgb(27, 27, 27);
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    margin: 0;
  
}

/* Container to center the form */
.container {
    background-color: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    width: 350px;
    text-align: center;
}

/* Title */
h3 {
    font-size: 24px;
    color:rgb(242, 244, 247);
    
}
h2{
    color:rgb(238, 242, 245);
    text-align:center;
}

/* Style the form */
form {
    max-width: 400px;
    margin: 50px auto;
    padding: 20px;
    background-color: rgb(25, 105, 42);
    color: white;
    border-radius: 35px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    height:800px
}

/* Style form labels */
label {
    font-weight: 600;
    text-align: left;
    display: block;
    margin: 10px 0 5px;
}

/* Style input fields */
input , select{
    padding: 12px;
    border-radius: 16px;
    border: 1px solid #ccc;
    width: 50%;
    font-size: 14px;
    transition: all 0.3s ease;
}

/* Input focus effect */
input:focus {
    border-color: #3498db;
    outline: none;
    box-shadow: 0 0 5px rgba(52, 152, 219, 0.4);
}

/* Style the register button */
button {
    margin-top: 15px;
    padding: 12px;
    background: linear-gradient(135deg, #3498db, #2980b9);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: 0.3s;
}

/* Button hover effect */
button:hover {
    background: linear-gradient(135deg, #2980b9, #1c658c);
}

/* Style links */
p {
    font-size: 14px;
    margin-top: 15px;
}

a {
    color: #3498db;
    text-decoration: none;
    font-weight: 600;
}

a:hover {
    text-decoration: underline;
}

/* Responsive Design */
@media (max-width: 400px) {
    .container {
        width: 90%;
        padding: 20px;
    }
}


    </style>    
    
    <title>sign up</title>
</head>
<body>

<form method="post">
    <h2>create account </h2>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>


</html>
