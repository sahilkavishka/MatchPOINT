{% extends 'base.html' %}

{% block content %}
<h2>Register for {{ tournament.name }}</h2>

<form method="POST">
    {% csrf_token %}
    <label for="team_name">Team Name:</label>
    <input type="text" name="team_name" required><br><br>

    <label for="members">Team Members (comma-separated):</label>
    <input type="text" name="members" required><br><br>
    <select name="team" id="team.id">
        {%for team in teams}
        
    </select>

    <button type="submit">Register</button>
</form>
{% endblock %}
