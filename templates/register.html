



<style>
.formm {
    border-radius:20px;
    max-width: 400px;
    width:600px;
    height:370px;
    margin-left:620px;
    margin-top:10px;
    margin-bottom:100px;
    padding: 10px;
    background-color: rgb(129, 209, 127);
    box-shadow: 10px 4px 12px rgb(7, 7, 7);
}
body{
    background-color:rgba(15, 104, 22, 0.56);
}
h2 {
    width:600px;
    margin-left:660px;
    color: black;
    margin-top:100px;
}

select {
    width: 100%;
    padding: 8px;
    border-radius: 14px;
    border: 1px solid rgb(27, 107, 47);
}

#members-area {
    background-color: #fff;
    padding: 10px;
    border-radius: 15px;
    border: 1px solid rgb(39, 165, 34);
    margin-top: 10px;
}
.reg {
    
    width: 98%;
    padding: 10px;
    margin:10px;
    font-size: 16px;
    background-color:rgb(16, 119, 25);
    color: white;
    border: 1px solid black ;
    border-radius: 15px;
    cursor: pointer;
}

.reg:hover {
    background-color:rgba(17, 170, 50, 0.72);
}
</style>
{% block content %}
<h2>Register for {{ tournament.name }}</h2>

{% if user.role == "Player" %}
<form class="formm" method="POST">
    {% csrf_token %}
    
    <label for="team">Team Name:</label>
    <select name="team" id="team" required onchange="loadTeamMembers()">
        <option value="">Select</option>
        {% for team in teams %}
            <option value="{{ team.id }}">{{ team.name }}</option>
        {% endfor %}
    </select><br><br>

    <label for="members">Team Members:</label>
    <div id="members-area">
        <p>Select a team to load members...</p>
    </div>

    <button class="reg" type="submit">Register</button>
    <button class="reg" type="reset">Reset</button>
    <button class="reg" type="button" onclick="history.back()">Back</button>
</form>
{% else %}
    <p><center>Only players can register</center></p>
{% endif %}

<script>
function loadTeamMembers() {
    const teamId = document.getElementById("team").value;
    const membersArea = document.getElementById("members-area");

    if (teamId) {
        fetch(`/get-team-members/${teamId}/`)
            .then(response => response.json())
            .then(data => {
                if (data.members.length > 0) {
                    membersArea.innerHTML = data.members.map(member =>
                        `<label><input type="checkbox" name="members" value="${member}"> ${member}</label><br>`
                    ).join('');
                } else {
                    membersArea.innerHTML = "<p>No members found.</p>";
                }
            })
            .catch(error => {
                membersArea.innerHTML = `<p>Error loading members: ${error.message}</p>`;
            });
    } else {
        membersArea.innerHTML = "<p>Select a team to load members...</p>";
    }
}
</script>
{% endblock %}
