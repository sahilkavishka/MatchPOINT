<!DOCTYPE html>
<html >
<head>
    <style type="text/css">
        /* Center the form on the page */
body {
    font-family: Arial, sans-serif;
    background-color: #202020;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    
}

/* Style the login form */
form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background-color: #171717;
    padding: 40px;
    border-radius: 30px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    width: 300px;
    
}

/* Style input fields */
input {
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

/* Style the login button */
button {
    padding: 10px;
    background-color:rgb(30, 206, 39);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    
}

/* Style the button on hover */
button:hover {
    background-color:rgb(2, 247, 2);
    
}

/* Style links */
a {
    color:rgb(30, 255, 0);
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

        </style>
    <title>log in</title>
</head>
<body>
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p><br>
    <p>reset password?<a href="{% url 'password_reset' %}">Forgot Password?</a></p>

    
</body>
</html>
