{% extends 'base.html' %}
{% block content %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Create Team</title>
    
</head>
<body>

    <div class="container">
        <h1>Create a New Team</h1>
        
        <form id="teamForm" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Team Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="sport">Sport</label>
                <select id="sport" name="sport" required>
                    {% for sport in sports %}
                        <option value="{{ sport.id }}">{{ sport.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="city">City</label>
                <select id="city" name="city" required>
                    {% for city in cities %}
                        <option value="{{ city.id }}">{{ city.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="contact_details">Contact Details</label>
                <input type="text" id="contact_details" name="contact_details">
            </div>
            
            <div class="form-group">
                <label for="rules">Rules</label>
                <textarea id="rules" name="rules" required></textarea>
                <p id="charCount">0 / 500</p>
            </div>
            
            <div class="form-group">
                <label for="capacity">Capacity</label>
                <input type="number" id="capacity" name="capacity" required min="1" placeholder='members'>
            </div>
            
            <div class="form-group">
                <label for="logo">Team Logo</label>
                <input type="file" id="logo" name="logo">
            </div>
            
            <div class="form-group">
                <button type="submit">Create Team</button>
            </div>
        </form>
    </div>

</body>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color:rgba(15, 104, 22, 0.56);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        
    }
    
    .container {
       background-color: rgb(129, 209, 127);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.64);
        width: 500px;
    }
    
    h1 {
        text-align: center;
        color:  rgb(0, 0, 0);
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
    }
    
    input, select, textarea {
        width: 90%;
        padding: 8px;
        border: 2px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }
    
    textarea {
        resize: vertical;
        height: 80px;
    }
    
    .form-group {
        width: 100%;
        padding: 10px;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }
    
    .form-group:hover {
        
        color:rgb(14, 51, 21);
    }
    
    #charCount {
        font-size: 12px;
        color: gray;
        text-align: right;
    }
    
</style>{% endblock %}
<script >
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("teamForm");
        const rulesInput = document.getElementById("rules");
        const charCount = document.getElementById("charCount");
    
        // Character count for rules field
        rulesInput.addEventListener("input", function () {
            const length = rulesInput.value.length;
            charCount.textContent = `${length} / 500`;
            if (length > 500) {
                charCount.style.color = "red";
            } else {
                charCount.style.color = "gray";
            }
        });
    
        // Form validation
        form.addEventListener("submit", function (event) {
            const name = document.getElementById("name").value.trim();
            const capacity = document.getElementById("capacity").value;
    
            if (name === "") {
                alert("Team name is required.");
                event.preventDefault();
            }
    
            if (capacity <= 0) {
                alert("Capacity must be at least 1.");
                event.preventDefault();
            }
        });
    });
    
</script>
</html>
