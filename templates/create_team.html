{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;600&display=swap');

    /* Background */
    body {
        background: linear-gradient(135deg,rgb(23, 24, 23),rgb(4, 37, 17));
        font-family: 'Roboto', sans-serif;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #e8f5e9;
      
    }

    /* Container */
    .container {
        background-color:rgba(26, 78, 29, 0.59);
        border-radius: 20px;
        padding: 40px 35px 45px;
        max-width: 520px;
        width: 100%;
        margin-top:500px;
        box-shadow: 0 8px 18px rgba(4, 221, 22, 0.88);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .container:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.85);
    }

    /* Heading */
    h1 {
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        font-size: 2.7rem;
        margin-bottom: 30px;
        text-align: center;
        color:rgb(108, 156, 108);
        text-shadow: 1.5px 1.5px 4px #1a2e18;
        user-select: none;
    }

    /* Labels */
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 1.05rem;
        color:rgb(235, 238, 235);
        user-select: none;
        transition: color 0.3s ease;
    }

    /* Inputs, selects, textarea */
    input[type="text"],
    input[type="number"],
    select,
    textarea,
    input[type="file"] {
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 22px;
        border-radius: 15px;
        border: 2px solid #4caf50;
        background-color: #f1f8f1;
        color:rgb(11, 12, 12);
        font-size: 1rem;
        font-weight: 600;
        box-shadow: inset 0 2px 6px rgba(46, 82, 48, 0.3);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus,
    textarea:focus,
    input[type="file"]:focus {
        outline: none;
        border-color: #81c784;
        box-shadow: 0 0 8px #81c784;
        background-color: #e8f5e9;
        color: #1b3a2a;
    }

    textarea {
        min-height: 100px;
        resize: vertical;
    }

    /* Char count */
    #charCount {
        font-size: 0.9rem;
        color: #a5d6a7;
        text-align: right;
        margin-top: -18px;
        margin-bottom: 20px;
        font-weight: 600;
        user-select: none;
    }

    /* Buttons */
    .btn {
        width: 100%;
        padding: 14px 0;
        margin-bottom: 14px;
        border-radius: 25px;
        border: none;
        background-color: #4caf50;
        color: #1b3a2a;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 15px rgba(46, 82, 48, 0.7);
        transition: background-color 0.3s ease, transform 0.2s ease;
        user-select: none;
        text-transform: uppercase;
        letter-spacing: 1.2px;
    }

    .btn:hover {
        background-color: #81c784;
        box-shadow: 0 10px 20px rgba(129, 199, 132, 0.85);
        transform: scale(1.05);
    }

    .btn:active {
        transform: scale(0.95);
    }

    /* Responsive */
    @media (max-width: 576px) {
        .container {
            padding: 30px 20px 40px;
            margin: 20px 10px;
        }
    }
</style>

<div class="container" role="main" aria-label="Create Team Form">
    <h1>Create a New Team</h1>
    <form id="teamForm" method="POST" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        
        <label for="name">Team Name</label>
        <input type="text" id="name" name="name" required autocomplete="off" />

        <label for="sport">Sport</label>
        <select id="sport" name="sport" required>
            {% for sport in sports %}
                <option value="{{ sport.id }}">{{ sport.name }}</option>
            {% endfor %}
        </select>

        <label for="city">City</label>
        <select id="city" name="city" required>
            {% for city in cities %}
                <option value="{{ city.id }}">{{ city.name }}</option>
            {% endfor %}
        </select>

        <label for="contact_details">Contact Details</label>
        <input type="text" id="contact_details" name="contact_details" placeholder="Optional" autocomplete="off" />

        <label for="rules">Rules</label>
        <textarea id="rules" name="rules" maxlength="500" required></textarea>
        <p id="charCount">0 / 500</p>

        <label for="capacity">Capacity</label>
        <input type="number" id="capacity" name="capacity" min="1" required placeholder="Number of members" />

        <label for="logo">Team Logo</label>
        <input type="file" id="logo" name="logo" accept="image/*" />

        <button type="submit" class="btn">Create Team</button>
        <button type="reset" class="btn">Reset</button>
        <button type="button" class="btn" onclick="history.back()">Back</button>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const rulesInput = document.getElementById("rules");
        const charCount = document.getElementById("charCount");

        rulesInput.addEventListener("input", () => {
            const length = rulesInput.value.length;
            charCount.textContent = `${length} / 500`;
            charCount.style.color = length > 500 ? "#e57373" : "#a5d6a7";
        });

        const form = document.getElementById("teamForm");
        form.addEventListener("submit", (e) => {
            const name = document.getElementById("name").value.trim();
            const capacity = parseInt(document.getElementById("capacity").value);

            if (!name) {
                alert("Team name is required.");
                e.preventDefault();
            }

            if (!capacity || capacity < 1) {
                alert("Capacity must be at least 1.");
                e.preventDefault();
            }
        });
    });
</script>
{% endblock %}
