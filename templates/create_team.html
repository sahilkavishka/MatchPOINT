
{% block content %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Create Team</title>
    
</head>
<body>
    <br><br><br><br>
    <div class="container">
        <h1><center>Create a New Team</center></h1>
        
        <form id="teamForm" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Team Name</label>
                <input type="text" id="name" name="name" required>
            
                <label for="sport">Sport</label>
                <select id="sport" name="sport" required>
                    {% for sport in sports %}
                        <option value="{{ sport.id }}">{{ sport.name }}</option>
                    {% endfor %}
                </select>
            
                <label for="city">City</label>
                <select id="city" name="city" required>
                    {% for city in cities %}
                        <option value="{{ city.id }}">{{ city.name }}</option>
                    {% endfor %}
                </select>
            
                <label for="contact_details">Contact Details</label>
                <input type="text" id="contact_details" name="contact_details">
            
                <label for="rules">Rules</label>
                <textarea id="rules" name="rules" required></textarea>
                <p id="charCount">0 / 500</p>
            
                <label for="capacity">Capacity</label>
                <input type="number" id="capacity" name="capacity" required min="1" placeholder='members'>
            
                <label for="logo">Team Logo</label>
                <input type="file" id="logo" name="logo">
            </div>
            
            
                <button type="submit" class="btn">Create Team</button>
                <button type="reset" class="btn">Reset</button>
                 <button class="btn" onclick="history.back()">BACK </button>
        </form>
    </div>

</body>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color:rgba(15, 104, 22, 0.56);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;  
    }
    
    .container {
       background-color: rgb(129, 209, 127);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.64);
        width: 500px;
    }
    
    .container-h1 {
       text-align:center;
    }
    
    
    
    label {
        display: block;
        font-weight: bold;
        
    }
    
    input, select, textarea {
        width: 90%;
        padding: 8px;
        border: 2px solid rgb(32, 122, 29);
        border-radius: 15px;
        font-size: 14px;
    }
    
    textarea {
        resize: vertical;
        height: 80px;
    }
    
    .form-group {
        width: 100%;
        padding: 10px;
        color: black;
       
        border-radius: 15px;
        cursor: pointer;
        font-size: 16px;
    }
      .btn{
        width: 100%;
        padding: 10px;
        margin-bottom:5px;
        background-color:rgba(24, 155, 74, 0.84);
        border-radius: 15px;
        box-shadow: 0 0 6px rgba(12, 12, 12, 0.69);
        cursor: pointer;
        font-size: 16px;
        border:solid 1px rgb(22, 21, 21);
        font-weight:bold;
      }

    .btn:hover {
        background-color:rgb(15, 209, 96);
        color:rgb(235, 241, 236);
    }
    
    
</style>
<script >
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("teamForm");
        const rulesInput = document.getElementById("rules");
        const charCount = document.getElementById("charCount");
    
        // Character count for rules field
        rulesInput.addEventListener("input", function () {
            const length = rulesInput.value.length;
            charCount.textContent = `${length} / 500`;
            if (length > 500) {
                charCount.style.color = "red";
            } else {
                charCount.style.color = "gray";
            }
        });
    
        // Form validation
        form.addEventListener("submit", function (event) {
            const name = document.getElementById("name").value.trim();
            const capacity = document.getElementById("capacity").value;
    
            if (name === "") {
                alert("Team name is required.");
                event.preventDefault();
            }
    
            if (capacity <= 0) {
                alert("Capacity must be at least 1.");
                event.preventDefault();
            }
        });
    });
    
</script>

</html>
{%endblock%}
