{% extends 'base.html' %}
{% block content %}
<h2 class="text-center mt-4" style="color:#00ff99;">🏆 Team Leaderboard</h2>

<div class="container mt-4">
    <table class="table table-dark table-bordered">
        <thead>
            <tr>
                <th>Team</th>
                <th>Sport</th>
                <th>City</th>
                <th>Points</th>
                <th>Wins</th>
                <th>Losses</th>
            </tr>
        </thead>
        <tbody>
            {% for team in teams %}
            <tr>
                <td>{{ team.name }}</td>
                <td>{{ team.sport.name }}</td>
                <td>{{ team.city.name }}</td>
                <td>{{ team.points }}</td>
                <td>{{ team.wins }}</td>
                <td>{{ team.losses }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="6">No teams yet</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
